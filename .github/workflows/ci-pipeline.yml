
name: CI Pipeline

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar proyecto
        run: |
          mkdir -p out
          javac -d out src/maquinadecafetdd3/Vaso.java src/maquinadecafetdd3/Cafetera.java src/maquinadecafetdd3/Azucarero.java src/maquinadecafetdd3/MaquinaDeCafe.java

      - name: Verificar compilacion
run: echo "Compilacion completada correctamente"
